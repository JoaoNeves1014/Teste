<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="centralizar-tela">
            <div class="caixa" style="width:320px">
                <h2 style="text-align:center" ;>Login</h2>

                <form>
                    <div class="grupo-input">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Digite seu email" required>

                    </div>

                    <div class="grupo-input">
                        <label for="senha">Senha</label>
                        <input type="senha" id="senha" placeholder="Digite sua senha" required>

                    </div>

                    <div class="grupo-input">
                        <label for="senha-rep">Repita a senha</label>
                        <input type="senha=rep" id="senha-rep" placeholder="Repita sua senha" required>

                    </div>

                    <button type="submit" class="botao-primario" style="width: 100%;">
                    Logar
                    </button>
                    
                </form>    
            </div>
        </div> 
</body>
</html>
