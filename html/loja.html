<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja</title>
    <link rel="stylesheet" href="/css/loja.css">
</head>
<body>
    <header class="navbar">
    <div class="logo">
        <h1>Store</h1>
    </div>

    <nav>
        <ul class="nav-links">
            <li><a href="/html/index.html">Home</a></li>
            <li><a href="/html/blog.html">Blog</a></li>
            <li><a href="/html/loja.html">Store</a></li>
            <li><a href="/html/projetinhos.html">Projetinhos</a></li>
        </ul>
    </nav>

    <div class="actions">
    <div class="search-container">
        <input type="text" placeholder="Pesquisar...">
        <button>🔍</button>
    </div>

    <div class="auth-buttons">
        <a href="/html/login.html" class="btn-login">Logar</a>
        <a href="/html/cadastro.html" class="btn-cadastro">Cadastrar</a>
    </div>
</div>
</header>

    <main>

        <section class="produtos">

            <div class="card">
                <img src="/img/Turbo .48.png" alt="Turbo .48">
                <h3>Turbo .48 T25 Master Power</h3>
                <p>R$2,899.00</p>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img src="/img/Carb Weber.png" alt="Weber">
                <h3>Kit 3 Carburadores Weber 40</h3>
                <p>R$2,642.00</p>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img src="/img/FT 450.png" alt="FT450">
                <h3>FT 450 - Injeção Programavel</h3>
                <p>R$3,740.00</p>
                <button>Comprar</button>
            </div>

            
            <div class="card">
                <img src="/img/Saia Vecão.png" alt="Saia Ant">
                <h3>Saia de Anteira para Vectra B</h3>
                <p>R$980.00</p>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img src="/img/Ponteira.png" alt="Ponteira">
                <h3>Abafador Esportivo em Aço Inox Luzian LA01 Pequeno</h3>
                <p>R$498.00</p>
                <button>Comprar</button>
