<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja</title>
    <link rel="stylesheet" href="loja.css">
</head>
<body>
    <h1>Loja</h1>

    <main>

        <section class="produtos">

            <div class="card">
                <img src="IMG\Turbo .48.png" alt="Turbo .48">
                <h3>Turbo .48 T25 Master Power</h3>
                <p>R$2,899.00</p>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img src="IMG\Carb Weber.png" alt="Weber">
                <h3>Kit 3 Carburadores Weber 40</h3>
                <p>R$2,642.00</p>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img src="IMG\FTL 450.png" alt="FT450">
                <h3>FT 450 - Injeção Programavel</h3>
                <p>R$3,740.00</p>
                <button>Comprar</button>
            </div>

            
            <div class="card">
                <img src="IMG\Saia Vecão.png" alt="Saia Ant">
                <h3>Saia de Anteira para Vectra B</h3>
                <p>R$980.00</p>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img src="IMG\Ponteira.png" alt="Ponteira">
                <h3>Abafador Esportivo em Aço Inox Luzian LA01 Pequeno</h3>
                <p>R$498.00</p>
                <button>Comprar</button>
            </div>

        </section>
    </main>
</body>
</html>
