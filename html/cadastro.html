<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/css/globlal.css">
</head>

<body>
    <div class="centralizar-tela">
        <div class="caixa">
            <h2>Cadastro</h2>

            <form>
                <div class="grupo-input">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite seu email" required>
                </div>

                <div class="grupo-input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="grupo-input">
                    <label for="senha-rep">Repita a senha</label>
                    <input type="password" id="senha-rep" placeholder="Repita sua senha" required>
                </div>

                <button type="submit" class="botao-primario">
                    Cadastrar
                </button>

                <a href="/html/index.html" class="botao-secundario">
                    ← Voltar para Home
                </a>
            </form>
        </div>
    </div>
</body>
</html>
